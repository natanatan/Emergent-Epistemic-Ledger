name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Upload over SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          SFTP_KEY_PASSPHRASE: ${{ secrets.SFTP_KEY_PASSPHRASE }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SFTP_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Remove the passphrase from the runner's temporary copy so lftp can use the key.
          ssh-keygen -p -P "$SFTP_KEY_PASSPHRASE" -N '' -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -p "${SFTP_PORT:-22}" "$SFTP_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Uploads new and changed files only; never deletes anything on the server.
          lftp -e "set sftp:connect-program 'ssh -a -x -i $HOME/.ssh/deploy_key -o BatchMode=yes'; set net:max-retries 2; mirror --reverse --verbose --no-perms site/dist '$SFTP_REMOTE_DIR'; bye" \
            -u "$SFTP_USER," -p "${SFTP_PORT:-22}" "sftp://$SFTP_HOST"
          rm -f ~/.ssh/deploy_key

      - name: Check the live site
        run: |
          for path in / /paper/ /code/ /principles/ /about/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://eel.emergentexistence.com$path" || true)
            echo "$path $code"
          done
          curl -sf https://eel.emergentexistence.com/ | grep -q 'Emergent Epistemic Ledger' && echo "Live site serves the new build." || echo "::warning::The live site did not return the expected page. Check DNS and SSL for eel.emergentexistence.com."
